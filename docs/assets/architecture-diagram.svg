<svg viewBox="0 0 990 490" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D" />
      <stop offset="50%" stop-color="#0E1118" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161A24" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10131B" stop-opacity="0.95" />
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0055D6" />
    </linearGradient>

    <linearGradient id="gradIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E5CE6" />
      <stop offset="100%" stop-color="#3634A3" />
    </linearGradient>

    <linearGradient id="gradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#1B7A30" />
    </linearGradient>

    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#B26500" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowCard" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .sf-header { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #FFFFFF; font-size: 16px; letter-spacing: -0.2px; }
    .sf-sub { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #86868B; font-size: 11px; }
    .sf-stage-num { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.5px; }
    .sf-card-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #F5F5F7; }
    .sf-item-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 11px; fill: #FFFFFF; }
    .sf-item-sub { font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace; font-size: 10px; fill: #86868B; }
    .sf-pill { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 10px; }
  </style>

  <!-- Background Base -->
  <rect width="990" height="490" rx="20" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Top Title Bar -->
  <g transform="translate(35, 26)">
    <rect width="210" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="13" cy="13" r="4" fill="#30D158" />
    <text x="25" y="17" class="sf-pill" fill="#F5F5F7">System Architecture V1</text>
    <text x="225" y="19" class="sf-header">End-to-End Reliable Webhook Delivery Pipeline</text>
  </g>

  <!-- ==================== STAGE 1: UPSTREAM ==================== -->
  <g transform="translate(35, 78)" filter="url(#shadowCard)">
    <rect width="195" height="265" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
    <rect width="195" height="3" rx="1.5" fill="url(#gradBlue)" />

    <!-- Stage Tag -->
    <text x="16" y="26" class="sf-stage-num" fill="#0A84FF">01 / TRIGGER</text>
    <text x="16" y="46" class="sf-card-title">Upstream Business</text>
    <text x="16" y="60" class="sf-sub">业务事件触发源</text>

    <!-- Items -->
    <g transform="translate(12, 75)">
      <rect width="171" height="42" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <circle cx="12" cy="21" r="3" fill="#0A84FF" />
      <text x="22" y="18" class="sf-item-title">Order Service</text>
      <text x="22" y="32" class="sf-item-sub">order.paid / created</text>
    </g>

    <g transform="translate(12, 125)">
      <rect width="171" height="42" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <circle cx="12" cy="21" r="3" fill="#0A84FF" />
      <text x="22" y="18" class="sf-item-title">Payment Engine</text>
      <text x="22" y="32" class="sf-item-sub">charge.succeeded</text>
    </g>

    <g transform="translate(12, 175)">
      <rect width="171" height="42" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <circle cx="12" cy="21" r="3" fill="#0A84FF" />
      <text x="22" y="18" class="sf-item-title">User Management</text>
      <text x="22" y="32" class="sf-item-sub">user.registered</text>
    </g>

    <g transform="translate(12, 225)">
      <rect width="171" height="26" rx="5" fill="rgba(10,132,255,0.1)" stroke="rgba(10,132,255,0.25)" />
      <text x="85" y="17" text-anchor="middle" class="sf-pill" fill="#64D2FF">POST /api/v1/tasks</text>
    </g>
  </g>

  <!-- Clean Chevron Arrow 1 -> 2 -->
  <g transform="translate(238, 200)">
    <path d="M 0 0 L 10 10 L 0 20" fill="none" stroke="#0A84FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== STAGE 2: INGESTION ==================== -->
  <g transform="translate(260, 78)" filter="url(#shadowCard)">
    <rect width="210" height="265" rx="14" fill="url(#cardGrad)" stroke="rgba(94,92,230,0.25)" />
    <rect width="210" height="3" rx="1.5" fill="url(#gradIndigo)" />

    <text x="16" y="26" class="sf-stage-num" fill="#5E5CE6">02 / INGESTION</text>
    <text x="16" y="46" class="sf-card-title">FastAPI Layer</text>
    <text x="16" y="60" class="sf-sub">毫秒级接入与校验</text>

    <g transform="translate(12, 75)">
      <rect width="186" height="46" rx="7" fill="rgba(94,92,230,0.06)" stroke="rgba(94,92,230,0.15)" />
      <text x="12" y="19" class="sf-item-title">Idempotency Guard</text>
      <text x="12" y="34" class="sf-item-sub">唯一索引查重，杜绝重复</text>
    </g>

    <g transform="translate(12, 129)">
      <rect width="186" height="46" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="19" class="sf-item-title">Pydantic Validation</text>
      <text x="12" y="34" class="sf-item-sub">URL/Method/Retries 严格校验</text>
    </g>

    <g transform="translate(12, 183)">
      <rect width="186" height="68" rx="7" fill="rgba(48,209,88,0.08)" stroke="rgba(48,209,88,0.25)" />
      <text x="12" y="20" class="sf-item-title" fill="#30D158">202 Accepted Fast ACK</text>
      <text x="12" y="36" class="sf-item-sub" fill="#86868B">事务落盘即返回 task_id</text>
      <text x="12" y="52" class="sf-pill" fill="#30D158">解耦主业务，零等待外部响应</text>
    </g>
  </g>

  <!-- Clean Chevron Arrow 2 -> 3 -->
  <g transform="translate(478, 200)">
    <path d="M 0 0 L 10 10 L 0 20" fill="none" stroke="#5E5CE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== STAGE 3: STORAGE & DISPATCH ==================== -->
  <g transform="translate(500, 78)" filter="url(#shadowCard)">
    <rect width="235" height="265" rx="14" fill="url(#cardGrad)" stroke="rgba(48,209,88,0.25)" />
    <rect width="235" height="3" rx="1.5" fill="url(#gradGreen)" />

    <text x="16" y="26" class="sf-stage-num" fill="#30D158">03 / ENGINE</text>
    <text x="16" y="46" class="sf-card-title">Store &amp; Dispatcher</text>
    <text x="16" y="60" class="sf-sub">持久化与智能调度</text>

    <g transform="translate(12, 75)">
      <rect width="211" height="42" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="18" class="sf-item-title">SQLite WAL (ACID)</text>
      <text x="12" y="32" class="sf-item-sub">tasks + delivery_logs 事务保障</text>
    </g>

    <g transform="translate(12, 125)">
      <rect width="211" height="42" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="18" class="sf-item-title">UPDATE ... RETURNING</text>
      <text x="12" y="32" class="sf-item-sub">原子批量抢占，彻底消灭 N+1</text>
    </g>

    <g transform="translate(12, 175)">
      <rect width="211" height="42" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="18" class="sf-item-title">Full Jitter Backoff</text>
      <text x="12" y="32" class="sf-item-sub">指数退避 + 随机打散抗雪崩</text>
    </g>

    <g transform="translate(12, 225)">
      <rect width="211" height="26" rx="5" fill="rgba(48,209,88,0.08)" stroke="rgba(48,209,88,0.2)" />
      <text x="105" y="17" text-anchor="middle" class="sf-pill" fill="#30D158">Semaphore 限流 + 优雅停机排空</text>
    </g>
  </g>

  <!-- Clean Chevron Arrow 3 -> 4 -->
  <g transform="translate(743, 200)">
    <path d="M 0 0 L 10 10 L 0 20" fill="none" stroke="#30D158" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== STAGE 4: DELIVERY & DLQ ==================== -->
  <g transform="translate(765, 78)" filter="url(#shadowCard)">
    <rect width="190" height="265" rx="14" fill="url(#cardGrad)" stroke="rgba(255,159,10,0.25)" />
    <rect width="190" height="3" rx="1.5" fill="url(#gradAmber)" />

    <text x="16" y="26" class="sf-stage-num" fill="#FF9F0A">04 / DELIVERY</text>
    <text x="16" y="46" class="sf-card-title">Target &amp; DLQ</text>
    <text x="16" y="60" class="sf-sub">外部接收端与兜底池</text>

    <!-- Top Webhooks -->
    <g transform="translate(12, 75)">
      <rect width="166" height="52" rx="7" fill="rgba(48,209,88,0.06)" stroke="rgba(48,209,88,0.2)" />
      <circle cx="12" cy="18" r="4" fill="#30D158" />
      <text x="22" y="20" class="sf-item-title" fill="#30D158">External Webhooks</text>
      <text x="12" y="38" class="sf-item-sub">HTTP 2xx ➔ DELIVERED</text>
    </g>

    <!-- 4xx Filter -->
    <g transform="translate(12, 135)">
      <rect width="166" height="42" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" />
      <text x="12" y="18" class="sf-item-title">4xx Error Filter</text>
      <text x="12" y="32" class="sf-item-sub">客户端错误直接归档，不重试</text>
    </g>

    <!-- Dead Letter Queue -->
    <g transform="translate(12, 185)">
      <rect width="166" height="66" rx="7" fill="rgba(255,69,58,0.08)" stroke="rgba(255,69,58,0.25)" />
      <circle cx="12" cy="18" r="4" fill="#FF453A" />
      <text x="22" y="20" class="sf-item-title" fill="#FF453A">Dead Letter (DLQ)</text>
      <text x="12" y="38" class="sf-item-sub">重试耗尽沉淀 / 完整日志</text>
      <text x="12" y="54" class="sf-pill" fill="#FF9F0A">POST /tasks/{id}/retry 补发</text>
    </g>
  </g>

  <!-- ==================== BOTTOM RESILIENCE PILLARS BAR ==================== -->
  <g transform="translate(35, 362)" filter="url(#shadowCard)">
    <rect width="920" height="100" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />

    <!-- Bar Header Tag -->
    <text x="20" y="25" class="sf-stage-num" fill="#86868B">CORE RELIABILITY &amp; RESILIENCE FOUNDATION (四重可靠性防线)</text>

    <!-- 4 Columns inside bottom bar -->
    <g transform="translate(16, 36)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="50" rx="8" fill="rgba(10,132,255,0.06)" stroke="rgba(10,132,255,0.15)" />
        <circle cx="14" cy="18" r="3" fill="#0A84FF" />
        <text x="24" y="20" class="sf-item-title">At-least-once 投递</text>
        <text x="14" y="38" class="sf-sub">事务持久化，重启零丢失</text>
      </g>

      <!-- Pillar 2 -->
      <g transform="translate(225, 0)">
        <rect width="210" height="50" rx="8" fill="rgba(255,159,10,0.06)" stroke="rgba(255,159,10,0.15)" />
        <circle cx="14" cy="18" r="3" fill="#FF9F0A" />
        <text x="24" y="20" class="sf-item-title">Orphan Sweeper 自愈</text>
        <text x="14" y="38" class="sf-sub">自动扫描恢复 &gt;300s 卡死任务</text>
      </g>

      <!-- Pillar 3 -->
      <g transform="translate(450, 0)">
        <rect width="210" height="50" rx="8" fill="rgba(48,209,88,0.06)" stroke="rgba(48,209,88,0.15)" />
        <circle cx="14" cy="18" r="3" fill="#30D158" />
        <text x="24" y="20" class="sf-item-title">Thundering Herd 防护</text>
        <text x="14" y="38" class="sf-sub">Full Jitter 消除重试雪崩</text>
      </g>

      <!-- Pillar 4 -->
      <g transform="translate(675, 0)">
        <rect width="210" height="50" rx="8" fill="rgba(191,90,242,0.06)" stroke="rgba(191,90,242,0.15)" />
        <circle cx="14" cy="18" r="3" fill="#BF5AF2" />
        <text x="24" y="20" class="sf-item-title">DLQ 一键运维重放</text>
        <text x="14" y="38" class="sf-sub">提供状态追踪与手动补发接口</text>
      </g>
    </g>
  </g>
</svg>
