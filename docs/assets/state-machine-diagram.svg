<svg viewBox="0 0 980 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="smBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D" />
      <stop offset="50%" stop-color="#0E1118" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <!-- Zone Background -->
    <linearGradient id="zoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12151E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0D1017" stop-opacity="0.9" />
    </linearGradient>

    <!-- State Node Gradients -->
    <linearGradient id="nodePending" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#0055D6" />
    </linearGradient>

    <linearGradient id="nodeProcessing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64D2FF" />
      <stop offset="100%" stop-color="#0A84FF" />
    </linearGradient>

    <linearGradient id="nodeDelivered" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30D158" />
      <stop offset="100%" stop-color="#1B7A30" />
    </linearGradient>

    <linearGradient id="nodeRetrying" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F0A" />
      <stop offset="100%" stop-color="#B26500" />
    </linearGradient>

    <linearGradient id="nodeDead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF453A" />
      <stop offset="100%" stop-color="#B81D13" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="smArrBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#0A84FF" />
    </marker>
    <marker id="smArrGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#30D158" />
    </marker>
    <marker id="smArrAmber" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#FF9F0A" />
    </marker>
    <marker id="smArrRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#FF453A" />
    </marker>
    <marker id="smArrPurple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#BF5AF2" />
    </marker>

    <!-- Shadows -->
    <filter id="nodeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .sf-header { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #FFFFFF; font-size: 16px; letter-spacing: -0.2px; }
    .sf-zone-tag { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 10px; fill: #636366; letter-spacing: 0.8px; }
    .sf-node-name { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #FFFFFF; letter-spacing: 0.3px; }
    .sf-node-sub { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: rgba(255,255,255,0.85); }
    .sf-edge-label { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 10.5px; }
    .sf-badge { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 10px; }
  </style>

  <!-- Background Base -->
  <rect width="980" height="440" rx="20" fill="url(#smBgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Top Navigation Header -->
  <g transform="translate(35, 24)">
    <rect width="180" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="13" cy="13" r="4" fill="#0A84FF" />
    <text x="25" y="17" class="sf-badge" fill="#F5F5F7">Task State Machine</text>
    <text x="195" y="19" class="sf-header">State Transitions &amp; Lifecycle Architecture</text>
  </g>

  <!-- ==================== 3 ZONAL PANELS (CLEAN CONTAINER BOXES) ==================== -->

  <!-- Zone 1: INGESTION -->
  <g transform="translate(35, 70)">
    <rect width="210" height="340" rx="14" fill="url(#zoneGrad)" stroke="rgba(255,255,255,0.05)" />
    <text x="16" y="24" class="sf-zone-tag">ZONE 1 / INGESTION</text>
  </g>

  <!-- Zone 2: EXECUTION & RETRY -->
  <g transform="translate(265, 70)">
    <rect width="360" height="340" rx="14" fill="url(#zoneGrad)" stroke="rgba(255,255,255,0.05)" />
    <text x="16" y="24" class="sf-zone-tag">ZONE 2 / DISPATCH &amp; BACKOFF CYCLE</text>
  </g>

  <!-- Zone 3: TERMINAL OUTCOMES -->
  <g transform="translate(645, 70)">
    <rect width="300" height="340" rx="14" fill="url(#zoneGrad)" stroke="rgba(255,255,255,0.05)" />
    <text x="16" y="24" class="sf-zone-tag">ZONE 3 / TERMINAL OUTCOMES &amp; DLQ</text>
  </g>

  <!-- ==================== CONNECTING ARROWS ==================== -->

  <!-- 1. PENDING -> PROCESSING -->
  <line x1="225" y1="150" x2="280" y2="150" stroke="#0A84FF" stroke-width="2" marker-end="url(#smArrBlue)" />
  <text x="252" y="140" text-anchor="middle" class="sf-edge-label" fill="#64D2FF">Atomic Claim</text>

  <!-- 2. PROCESSING -> DELIVERED (Success) -->
  <line x1="500" y1="150" x2="665" y2="150" stroke="#30D158" stroke-width="2.5" marker-end="url(#smArrGreen)" />
  <text x="582" y="140" text-anchor="middle" class="sf-edge-label" fill="#30D158">HTTP 2xx (投递成功)</text>

  <!-- 3. PROCESSING -> RETRYING (Down on 5xx/Timeout) -->
  <line x1="395" y1="190" x2="395" y2="258" stroke="#FF9F0A" stroke-width="2" marker-end="url(#smArrAmber)" />
  <text x="408" y="228" class="sf-edge-label" fill="#FF9F0A">5xx / 429 / Timeout</text>

  <!-- 4. PROCESSING -> DEAD (4xx Non-retryable drop) -->
  <path d="M 500 165 C 570 185, 610 240, 665 285" fill="none" stroke="#FF453A" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#smArrRed)" />
  <text x="605" y="215" class="sf-edge-label" fill="#FF453A">4xx Client Error</text>

  <!-- 5. RETRYING -> DEAD (Max Retries Exhausted) -->
  <line x1="500" y1="300" x2="665" y2="300" stroke="#FF453A" stroke-width="2" marker-end="url(#smArrRed)" />
  <text x="582" y="292" text-anchor="middle" class="sf-edge-label" fill="#FF453A">retries &gt;= max</text>

  <!-- 6. RETRYING -> PENDING (Loop back left when backoff expires) -->
  <path d="M 290 300 L 140 300 L 140 198" fill="none" stroke="#FF9F0A" stroke-width="2" marker-end="url(#smArrAmber)" />
  <text x="215" y="292" text-anchor="middle" class="sf-edge-label" fill="#FFD60A">next_retry_at &lt;= now</text>

  <!-- 7. DEAD -> PENDING (Bottom Manual Replay Arc) -->
  <path d="M 780 340 L 780 380 L 80 380 L 80 198" fill="none" stroke="#BF5AF2" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#smArrPurple)" />
  <text x="430" y="372" text-anchor="middle" class="sf-edge-label" fill="#BF5AF2">POST /api/v1/tasks/{id}/retry (人工一键补发重放)</text>

  <!-- ==================== STATE NODES ==================== -->

  <!-- Node 1: PENDING -->
  <g transform="translate(55, 115)" filter="url(#nodeShadow)">
    <rect width="170" height="72" rx="14" fill="url(#nodePending)" />
    <circle cx="24" cy="36" r="6" fill="#FFFFFF" />
    <text x="38" y="32" class="sf-node-name">PENDING</text>
    <text x="38" y="50" class="sf-node-sub">已持久化入库 / 待调度</text>
  </g>

  <!-- Node 2: PROCESSING -->
  <g transform="translate(290, 115)" filter="url(#nodeShadow)">
    <rect width="210" height="72" rx="14" fill="url(#nodeProcessing)" />
    <circle cx="24" cy="36" r="6" fill="#FFFFFF" />
    <text x="38" y="32" class="sf-node-name">PROCESSING</text>
    <text x="38" y="50" class="sf-node-sub">Worker 投递执行中</text>
    <!-- Sweeper Note inside card -->
    <g transform="translate(14, 55)">
      <text x="0" y="7" font-size="9" fill="#0A2C66" font-family="-apple-system, sans-serif" font-weight="600">🛡️ Orphan Sweeper 兜底自愈</text>
    </g>
  </g>

  <!-- Node 3: DELIVERED (Success Terminal) -->
  <g transform="translate(675, 115)" filter="url(#nodeShadow)">
    <rect width="240" height="72" rx="14" fill="url(#nodeDelivered)" />
    <circle cx="26" cy="36" r="8" fill="rgba(255,255,255,0.25)" />
    <path d="M 22 36 L 25 39 L 30 33" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="42" y="32" class="sf-node-name">DELIVERED</text>
    <text x="42" y="50" class="sf-node-sub">HTTP 2xx 投递成功 (终态)</text>
  </g>

  <!-- Node 4: RETRYING -->
  <g transform="translate(290, 265)" filter="url(#nodeShadow)">
    <rect width="210" height="72" rx="14" fill="url(#nodeRetrying)" />
    <circle cx="24" cy="36" r="6" fill="#FFFFFF" />
    <text x="38" y="32" class="sf-node-name">RETRYING</text>
    <text x="38" y="50" class="sf-node-sub">Full Jitter 指数退避中</text>
    <!-- Backoff Note inside card -->
    <g transform="translate(14, 55)">
      <text x="0" y="7" font-size="9" fill="#4D2800" font-family="-apple-system, sans-serif" font-weight="600">⚡ 随机打散，防重试雪崩</text>
    </g>
  </g>

  <!-- Node 5: DEAD (DLQ) -->
  <g transform="translate(675, 265)" filter="url(#nodeShadow)">
    <rect width="240" height="72" rx="14" fill="url(#nodeDead)" />
    <circle cx="26" cy="36" r="8" fill="rgba(255,255,255,0.25)" />
    <line x1="26" y1="32" x2="26" y2="36" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <circle cx="26" cy="40" r="1" fill="#FFFFFF" />
    <text x="42" y="32" class="sf-node-name">DEAD (DLQ)</text>
    <text x="42" y="50" class="sf-node-sub">死信池归档 / 完整审计日志</text>
  </g>

</svg>
