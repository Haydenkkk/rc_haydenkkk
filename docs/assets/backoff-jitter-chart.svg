<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="chartBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090D" />
      <stop offset="100%" stop-color="#0E1118" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161A24" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#10131B" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="fixedSpikeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF453A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF453A" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="jitterSpreadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30D158" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2997FF" stop-opacity="0.2" />
    </linearGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    .sf-header { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 600; fill: #FFFFFF; font-size: 16px; }
    .sf-title { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; }
    .sf-sub { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 400; fill: #86868B; font-size: 11px; }
    .sf-badge { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 10px; }
    .sf-code { font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace; font-size: 10px; }
    .axis-label { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 10px; fill: #636366; }
  </style>

  <!-- Background Base -->
  <rect width="960" height="340" rx="20" fill="url(#chartBgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Top Title Header -->
  <g transform="translate(36, 22)">
    <rect width="210" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <circle cx="13" cy="13" r="4" fill="#30D158" />
    <text x="25" y="17" class="sf-badge" fill="#F5F5F7">Reliability Engineering</text>
    <text x="225" y="19" class="sf-header">Exponential Backoff vs. Full Jitter</text>
  </g>

  <!-- ==================== LEFT CARD: FIXED BACKOFF (PROBLEM) ==================== -->
  <g transform="translate(36, 66)" filter="url(#cardShadow)">
    <rect width="430" height="245" rx="14" fill="url(#cardGrad)" stroke="rgba(255,69,58,0.25)" />
    <rect width="430" height="3" rx="1.5" fill="#FF453A" />

    <circle cx="24" cy="24" r="8" fill="rgba(255,69,58,0.15)" />
    <text x="20" y="28" font-size="11" fill="#FF453A" font-weight="bold">✕</text>
    <text x="40" y="28" class="sf-title" fill="#FF453A">固定指数退避 (Fixed Backoff)</text>
    <text x="40" y="44" class="sf-sub">所有失败请求在同一时间点同步重试 ➔ 重试风暴</text>

    <!-- Coordinates Area -->
    <g transform="translate(45, 75)">
      <!-- Grid Axis -->
      <line x1="0" y1="120" x2="340" y2="120" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <line x1="0" y1="120" x2="0" y2="10" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

      <!-- Labels -->
      <text x="-30" y="20" class="axis-label">并发量</text>
      <text x="310" y="136" class="axis-label">时间</text>

      <!-- Spike 1 at T=1s -->
      <rect x="50" y="25" width="18" height="95" rx="3" fill="url(#fixedSpikeGrad)" stroke="#FF453A" stroke-width="1.2" />
      <text x="59" y="136" text-anchor="middle" class="sf-code" fill="#86868B">1s</text>

      <!-- Spike 2 at T=2s -->
      <rect x="130" y="15" width="18" height="105" rx="3" fill="url(#fixedSpikeGrad)" stroke="#FF453A" stroke-width="1.2" />
      <text x="139" y="136" text-anchor="middle" class="sf-code" fill="#86868B">2s</text>

      <!-- Spike 3 at T=4s -->
      <rect x="230" y="10" width="18" height="110" rx="3" fill="url(#fixedSpikeGrad)" stroke="#FF453A" stroke-width="1.2" />
      <text x="239" y="136" text-anchor="middle" class="sf-code" fill="#86868B">4s</text>

      <!-- Danger Indicator -->
      <line x1="0" y1="40" x2="330" y2="40" stroke="#FF453A" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
      <g transform="translate(180, 48)">
        <rect width="140" height="22" rx="4" fill="rgba(255,69,58,0.15)" stroke="rgba(255,69,58,0.3)" />
        <text x="70" y="15" text-anchor="middle" class="sf-badge" fill="#FF453A">重试尖峰 ➔ 击垮外部服务</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT CARD: FULL JITTER (SOLUTION) ==================== -->
  <g transform="translate(494, 66)" filter="url(#cardShadow)">
    <rect width="430" height="245" rx="14" fill="url(#cardGrad)" stroke="rgba(48,209,88,0.25)" />
    <rect width="430" height="3" rx="1.5" fill="#30D158" />

    <circle cx="24" cy="24" r="8" fill="rgba(48,209,88,0.15)" />
    <text x="20" y="28" font-size="11" fill="#30D158" font-weight="bold">✓</text>
    <text x="40" y="28" class="sf-title" fill="#30D158">Full Jitter 全抖动随机打散 (本系统实现)</text>
    <text x="40" y="44" class="sf-sub">重试流量在时间区间内平滑分布 ➔ 给外部自愈窗口</text>

    <!-- Coordinates Area -->
    <g transform="translate(45, 75)">
      <!-- Grid Axis -->
      <line x1="0" y1="120" x2="340" y2="120" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <line x1="0" y1="120" x2="0" y2="10" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

      <!-- Labels -->
      <text x="-30" y="20" class="axis-label">并发量</text>
      <text x="310" y="136" class="axis-label">时间</text>

      <!-- Smooth Jittered Bars -->
      <rect x="25" y="85" width="14" height="35" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="45" y="80" width="14" height="40" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="65" y="90" width="14" height="30" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="85" y="75" width="14" height="45" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="105" y="82" width="14" height="38" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="125" y="88" width="14" height="32" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="145" y="78" width="14" height="42" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="165" y="84" width="14" height="36" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="185" y="80" width="14" height="40" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="205" y="86" width="14" height="34" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="225" y="92" width="14" height="28" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="245" y="85" width="14" height="35" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="265" y="90" width="14" height="30" rx="2" fill="url(#jitterSpreadGrad)" />
      <rect x="285" y="94" width="14" height="26" rx="2" fill="url(#jitterSpreadGrad)" />

      <!-- Safe Peak Indicator -->
      <line x1="0" y1="70" x2="330" y2="70" stroke="#30D158" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6" />
      <text x="220" y="64" class="sf-badge" fill="#30D158">安全承载上限 (Safe Limit)</text>

      <!-- Formula Pill Top -->
      <g transform="translate(10, 5)">
        <rect width="310" height="22" rx="4" fill="rgba(48,209,88,0.1)" stroke="rgba(48,209,88,0.25)" />
        <text x="155" y="15" text-anchor="middle" class="sf-code" fill="#30D158">Wait = Uniform(0.1, min(60s, 1.0s * 2^retry))</text>
      </g>
    </g>
  </g>
</svg>
