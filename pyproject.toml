[project]
name = "rc-haydenkkk"
version = "0.1.0"
description = "Reliable Outbound Webhook & API Notification Delivery Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite",
    "fastapi",
    "greenlet>=3.5.5",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff>=0.16.5",
    "sqlalchemy",
    "uvicorn",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

